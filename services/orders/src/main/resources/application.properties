# ================================================================= #
# SERVER CONFIGURATION
# ================================================================= #
server.port=8083
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,text/plain,text/css,application/javascript,text/html
server.forward-headers-strategy=framework

# ================================================================= #
# ACTUATOR / HEALTH / METRICS (Cho Kubernetes Liveness/Readiness)
# ================================================================= #
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ================================================================= #
# LOGGING & OTHERS
# ================================================================= #
logging.file.name=
spring.main.banner-mode=off
logging.level.com.dacn.ordersservice=INFO

# ================================================================= #
# CORS CONFIGURATION
# Lấy từ ConfigMap FRONTEND_URL
# ================================================================= #
app.cors.allowed-origins=${FRONTEND_URL:*} 

# ================================================================= #
# INTER-SERVICE CLIENT (WebClient) CONFIGURATION
# Sử dụng DNS nội bộ của Kubernetes (ClusterIP)
# ================================================================= #
# Lấy từ global-configs ConfigMap
app.client.users-service.url=${APP_SERVICES_USERS_URL:http://users-service:8082}
app.client.products-service.url=${APP_SERVICES_PRODUCTS_URL:http://products-service:8081}
app.client.timeout-ms=5000

# ================================================================= #
# OPENAPI / SWAGGER-UI
# ================================================================= #
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.writer-with-default-pretty-printer=false

# ================================================================= #
# DATABASE - AWS RDS (ORDERS SERVICE)
# Khớp với Terraform: db_name="foodhub_orders", role="user_orders"
# ================================================================= #
# 1. URL kết nối cho Orders Service (Từ global-configs)
spring.datasource.url=${DB_URL_ORDERS:jdbc:postgresql://foodhub-db.cnwgawc8eb9k.ap-southeast-1.rds.amazonaws.com:5432/foodhub_orders}

# 2. Username (Inject từ orders-values.yaml)
spring.datasource.username=${DB_USER:user_orders}

# 3. Password (Inject từ Secret foodhub-secrets qua key DB_PASSWORD_ORDERS)
spring.datasource.password=${DB_PASSWORD:Password_orders_123}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================================================================= #
# JSON WEB TOKEN (JWT)
# ================================================================= #
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ================================================================= #
# INFO / BUILD METADATA
# ================================================================= #
management.info.env.enabled=true
info.app.name=orders-service
info.app.version=1.0.0