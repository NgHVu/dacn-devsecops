# ================================================================= #
# SERVER CONFIGURATION
# ================================================================= #
server.port=8081
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,text/plain,text/css,application/javascript,text/html
server.forward-headers-strategy=framework

# ================================================================= #
# ACTUATOR / HEALTH / METRICS (Kubernetes Liveness/Readiness)
# ================================================================= #
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ================================================================= #
# LOGGING & OTHERS
# ================================================================= #
logging.file.name=
spring.main.banner-mode=off

# ================================================================= #
# CORS CONFIGURATION
# Lấy URL của Frontend từ ConfigMap để bảo mật, fallback là '*'
# ================================================================= #
app.cors.allowed-origins=${FRONTEND_URL:*} 

# ================================================================= #
# OPENAPI / SWAGGER-UI
# ================================================================= #
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.writer-with-default-pretty-printer=false

# ================================================================= #
# DATABASE - AWS RDS (PRODUCTS SERVICE)
# Khớp với Terraform: db_name="foodhub_products", role="user_products"
# ================================================================= #
# 1. URL kết nối (Sử dụng biến riêng cho Products từ ConfigMap)
spring.datasource.url=${DB_URL_PRODUCTS:jdbc:postgresql://foodhub-dev-db.cnwgawc8eb9k.ap-southeast-1.rds.amazonaws.com:5432/foodhub_products}

# 2. Username (Sẽ được Helm inject từ products-values.yaml)
spring.datasource.username=${DB_USER_PRODUCTS:user_products}

# 3. Password (Sẽ được inject từ Secret foodhub-secrets qua key DB_PASSWORD_PRODUCTS)
spring.datasource.password=${DB_PASSWORD_PRODUCTS:Password_products_123}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================================================================= #
# DATA SEEDING & PROFILES
# ================================================================= #
app.seed.enabled=true
# Profile 'dev' sẽ được kích hoạt thông qua ConfigMap
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ================================================================= #
# INFO / BUILD METADATA
# ================================================================= #
management.info.env.enabled=true
info.app.name=products-service
info.app.version=1.0.0

# ================================================================= #
# CẤU HÌNH BẢO MẬT (JWT) 
# ================================================================= #
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ================================================================= #
# CẤU HÌNH GIAO TIẾP INTER-SERVICE
# Gọi sang Orders Service bằng DNS nội bộ của Kubernetes Cluster
# ================================================================= #
app.services.orders.url=${APP_SERVICES_ORDERS_URL:http://foodhub-dev-orders:8083}